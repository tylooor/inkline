name: Inkline
options:
  bundleIdPrefix: com.inkline
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  Inkline:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Inkline
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkline.Inkline
        CODE_SIGN_STYLE: Automatic
  InklineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Inkline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  InklineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Inkline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Inkline:
    build:
      targets:
        Inkline: all
    test:
      targets:
        - InklineTests
        - InklineUITests
